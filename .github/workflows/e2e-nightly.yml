name: E2E nightly

on:
  schedule:
    # 20:15 UTC = 00:15 in Yerevan (UTC+4), every day. At that hour the UTC date and the Yerevan date differ, which is when the
    # "near midnight" bugs show (2026-11 analysis: several fixes were for tests that broke only around Yerevan midnight). The
    # Saturday run is Sunday 00:15 in Yerevan and the Sunday run is Monday 00:15 (the week starts on Monday), so both week edges
    # are tested every week, and the last day of each month tests the month edge. Outside business hours; no PR traffic.
    - cron: "15 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # the "nightly is red" issue below

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldvisits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldvisits_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: PDF renderer (pdftoppm, for the document previews)
        run: command -v pdftoppm || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils)

      - run: npm run migrate

      - run: npx playwright install --with-deps chromium webkit   # the full run includes the @iphone tests in Safari's engine

      # the deploy build, the scripts phones get (docs/architecture-roadmap.md step 10b)
      - run: npm run build:client

      - run: npm run test:e2e
        env:
          CLIENT_BUILD: "1"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-nightly-report
          path: server/playwright-report/
          retention-days: 14

      # Desktop roadmap step 10: a screenshot of every main page at 1440 and 1920 px (desktop-shots.spec.mjs), kept two weeks.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-shots
          path: server/test-results/desktop-shots/
          retention-days: 14
          if-no-files-found: ignore

      # A red nightly used to go unseen for weeks (red from 2026-10-15 to 2026-11-07). One open issue says so (GitHub e-mails the
      # owner), a new comment each red night, and it closes itself on the next green night.
      - name: Tell the owner (issue) when the nightly is red, close it when green
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ job.status }}
        with:
          script: |
            const title = "Nightly browser tests are red";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "nightly-red", per_page: 5 });
            const issue = open.find((i) => i.title === title);
            if (process.env.OUTCOME === "success") {
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Green again: ${run}` });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
              }
              return;
            }
            const body = `The nightly browser test run failed: ${run}\n\nThe report (which tests, screenshots) is the \`playwright-nightly-report\` artifact of that run.`;
            if (issue) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["nightly-red"] });
