name: E2E nightly

on:
  schedule:
    # 02:00 UTC every day -- outside business hours for this app's Yerevan
    # (UTC+4) users, and well clear of the CI job's own PR/push traffic.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldvisits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldvisits_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run migrate

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-nightly-report
          path: server/playwright-report/
          retention-days: 14
