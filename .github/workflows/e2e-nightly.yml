name: E2E nightly

on:
  schedule:
    # 02:00 UTC on Mondays and Thursdays -- outside business hours for this app's Yerevan
    # (UTC+4) users. Was every night; twice a week saves GitHub Actions minutes while every PR
    # still runs the @smoke browser tests (owner, 2026-10-27). Manual run: Actions -> Run workflow.
    - cron: "0 2 * * 1,4"
  workflow_dispatch: {}

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldvisits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldvisits_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: PDF renderer (pdftoppm, for the document previews)
        run: command -v pdftoppm || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils)

      - run: npm run migrate

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-nightly-report
          path: server/playwright-report/
          retention-days: 14

      # Desktop roadmap step 10: a screenshot of every main page at 1440 and 1920 px (desktop-shots.spec.mjs), kept two weeks.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-shots
          path: server/test-results/desktop-shots/
          retention-days: 14
          if-no-files-found: ignore
