name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}   # the weekly dependency-fix workflow starts CI on its own branch this way (a push by GITHUB_TOKEN does not)

# A new push to the same branch / PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation / skill-only changes (docs/, .claude/skills/, any .md) skip the slow jobs below. The cheap `static` job and the
  # `test` summary always run, so the required check names are always reported. Anything else, or no usable base to compare with,
  # runs everything.
  changes:
    name: changes (docs only?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          case "$EVENT" in
            pull_request) files="$(git diff --name-only HEAD^1 HEAD)" ;;   # HEAD is the merge commit: what this PR brings to the base
            push)
              if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then files="$(git diff --name-only "$BEFORE_SHA" HEAD)"; else files=""; fi ;;
            *) files="" ;;
          esac
          echo "changed files:"; echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^(docs/|\.claude/skills/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "-> runs everything"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "-> documentation only: tests and browser jobs are skipped"
          fi

  # The quick static checks run on their own runner, next to the tests instead of in front of them.
  static:
    name: static (version, ui, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci --no-audit --no-fund --prefer-offline

      - run: npm run check:version

      - run: npm run verify:ui

      # Dependency scanning (improvement list 8.3): fails the build on any
      # high/critical advisory. Left at "high" rather than "moderate" so an
      # existing lower-severity transitive advisory (see uuid via exceljs)
      # doesn't turn every PR red on its own -- ratchet this down once
      # that's cleared.
      - run: npm audit --audit-level=high

  # The integration suite is split over four runners (node --test --test-shard), each with its own disposable database. The test files
  # make their own fixtures and run in parallel against one database anyway, so they do not depend on each other.
  unit:
    name: tests (shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldvisits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldvisits_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci --no-audit --no-fund --prefer-offline

      - run: npm run migrate

      - name: Tests (shard ${{ matrix.shard }}/4)
        run: node --test --test-shard=${{ matrix.shard }}/4 $(find test -name '*.test.js' | sort | grep -vxF "$(cat test/isolated-*.txt)")

  # The files listed in server/test/isolated-*.txt (see server/test/ISOLATED.md; one list for CI and scripts/local-ci.sh) change or read state every
  # other test can see: the bonus switch (bonus group); lockdown, the ERP sync's TRUNCATE, the global route plan and Vaghinak's whole-database
  # tick (other group). Each group gets a database to itself and runs one file after the other, in parallel with the shards and each other.
  isolated:
    name: tests (isolated ${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [bonus, other]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldvisits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldvisits_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci --no-audit --no-fund --prefer-offline

      - run: npm run migrate

      - run: node --test --test-concurrency=1 $(cat test/isolated-${{ matrix.group }}.txt)

  # The one check name the repository has always required: green only when the static checks passed and every test job passed
  # (or was skipped because only documentation changed).
  test:
    name: test
    needs: [changes, static, unit, isolated]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Static checks and all test jobs passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          ISOLATED: ${{ needs.isolated.result }}
        run: |
          echo "changes: $CHANGES (code=$CODE), static: $STATIC, shards: $UNIT, isolated: $ISOLATED"
          [ "$CHANGES" = "success" ] && [ "$STATIC" = "success" ] || exit 1
          for r in "$UNIT" "$ISOLATED"; do
            [ "$r" = "success" ] || { [ "$CODE" = "false" ] && [ "$r" = "skipped" ]; } || exit 1
          done

  # Fast browser-driven subset (step 4 of the stabilization plan, test/e2e) --
  # only the @smoke-tagged specs, so a real-browser run doesn't gate every PR
  # on the full suite's runtime. The complete suite runs nightly instead
  # (see e2e-nightly.yml).
  e2e-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldvisits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldvisits_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci --no-audit --no-fund --prefer-offline

      - run: npm run migrate

      - name: Playwright version (cache key)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e:smoke

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: server/playwright-report/
          retention-days: 7
