name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldvisits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldvisits_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run migrate

      - run: npm test

      - run: npm run verify:ui

      # Dependency scanning (improvement list 8.3): fails the build on any
      # high/critical advisory. Left at "high" rather than "moderate" so an
      # existing lower-severity transitive advisory (see uuid via exceljs)
      # doesn't turn every PR red on its own -- ratchet this down once
      # that's cleared.
      - run: npm audit --audit-level=high
