<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content: on the keyboard opening, shrink
         the layout viewport instead of iOS/Android's default of panning the
         visual viewport up -- that default is what was shoving the fixed
         top bar under the status bar whenever a search input got focused. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>KAD Motors</title>
    <meta name="theme-color" content="#f6f7f9" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KAD Motors" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script src="js/theme-init.js"></script>
    <script src="js/perf-mode-init.js"></script>

    <!-- Leaflet + its plugins' stylesheets/scripts are loaded on demand by
         leafletLoader.js (idle-preloaded by app.js right after boot, same
         as the bottom-nav view modules) instead of unconditionally here --
         ~208KB of JS a session that never opens Map/Add-customer never
         needed to parse. -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/activity-search-filters.css" />
    <link rel="stylesheet" href="css/activity-date-picker.css" />
    <link rel="stylesheet" href="css/orders-search-filters.css" />
    <link rel="stylesheet" href="css/unified-search.css" />
    <link rel="stylesheet" href="css/order-map-filter-enhancements.css" />
    <link rel="stylesheet" href="css/field-visit-enhancements.css" />
    <link rel="stylesheet" href="css/customer-social.css" />
    <link rel="stylesheet" href="css/map-marker-system.css" />
    <link rel="stylesheet" href="css/map-safe-enhancements.css" />
  </head>
  <body>
    <div id="sync-banner" class="sync-banner" role="status" aria-live="polite" hidden></div>
    <!-- Desktop-only (min-width: 1024px, see styles.css) persistent nav --
         replaces nav-bar below at that width. Hidden by default like the
         other shell chrome; app.js fills it in once a user is logged in. -->
    <nav id="sidebar" class="sidebar" aria-label="Primary navigation" hidden></nav>
    <header id="top-bar" class="top-bar" hidden></header>
    <main id="app" class="app-main" tabindex="-1"></main>
    <nav id="nav-bar" class="nav-bar" aria-label="Primary navigation" hidden></nav>
    <div id="install-root"></div>
    <div id="update-root"></div>

    <script type="module" src="js/competitorPolicySafe.js"></script>
    <script type="module" src="js/activityDatePicker.js"></script>
    <script type="module" src="js/ordersSearchEnhancements.js"></script>
    <script type="module" src="js/unifiedSearchEnhancements.js"></script>
    <script type="module" src="js/customerPortfolioUi.js"></script>
    <script type="module" src="js/ordersRegionStatusEnhancements.js"></script>
    <script type="module" src="js/mapDimensionFilterPlacement.js"></script>
    <script type="module" src="js/fieldVisitEnhancements.js"></script>
    <script type="module" src="js/customerSocialProfiles.js"></script>
    <script type="module" src="js/mapMarkerEnhancements.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/mapSafeUi.js"></script>
  </body>
</html>
