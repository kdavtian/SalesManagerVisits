<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content: on the keyboard opening, shrink
         the layout viewport instead of iOS/Android's default of panning the
         visual viewport up -- that default is what was shoving the fixed
         top bar under the status bar whenever a search input got focused. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Disguise metadata: when the admin has turned Calculator Mode on
         (Settings > Administration), this app opens as a plain-looking
         Calculator (icon, name, initial screen) until the correct unlock
         code is entered -- see js/bootGate.js. Filled in server-side, not
         swapped at runtime, so the home-screen icon and app switcher
         preview are correct before the real app's code ever loads. -->
    <!--CALCULATOR_MODE_HEAD-->
    <!--CALCULATOR_MODE_FLAG-->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script src="js/theme-init.js"></script>
    <script src="js/perf-mode-init.js"></script>
    <script src="js/zoom-lock.js"></script>

    <!-- Leaflet + its plugins' stylesheets/scripts are loaded on demand by
         leafletLoader.js (idle-preloaded by app.js right after boot, same
         as the bottom-nav view modules) instead of unconditionally here --
         ~208KB of JS a session that never opens Map/Add-customer never
         needed to parse. -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/activity-search-filters.css" />
    <link rel="stylesheet" href="css/activity-date-picker.css" />
    <link rel="stylesheet" href="css/orders-search-filters.css" />
    <link rel="stylesheet" href="css/unified-search.css" />
    <link rel="stylesheet" href="css/order-map-filter-enhancements.css" />
    <link rel="stylesheet" href="css/field-visit-enhancements.css" />
    <link rel="stylesheet" href="css/customer-social.css" />
    <link rel="stylesheet" href="css/map-marker-system.css" />
    <link rel="stylesheet" href="css/map-safe-enhancements.css" />
  </head>
  <body>
    <div id="sync-banner" class="sync-banner" role="status" aria-live="polite" hidden></div>
    <!-- Desktop-only (min-width: 1024px, see styles.css) persistent nav --
         replaces nav-bar below at that width. Hidden by default like the
         other shell chrome; app.js fills it in once a user is logged in. -->
    <nav id="sidebar" class="sidebar" aria-label="Primary navigation" hidden></nav>
    <header id="top-bar" class="top-bar" hidden></header>
    <main id="app" class="app-main" tabindex="-1"></main>
    <nav id="nav-bar" class="nav-bar" aria-label="Primary navigation" hidden></nav>
    <div id="install-root"></div>
    <div id="update-root"></div>

    <!-- Pure CSS, no JS: field reps use this one-handed, walking a customer's
         floor -- an accidental landscape flip (phone in a pocket, set down on
         a counter) shouldn't ever land them in a reflowed layout mid-task.
         Blocks phones only (see styles.css's phone-rotate-lock media query,
         keyed off landscape *height* -- a phone's short axis in landscape is
         well under a tablet's, so a tablet turned sideways is untouched and
         keeps its full landscape layout). Both languages are always in the
         markup rather than picked by JS/i18n.js, since this has to render
         correctly even during the Calculator Mode lock screen, before any
         app module (including i18n.js) has loaded. -->
    <div class="phone-rotate-lock-overlay" role="alert" aria-live="assertive">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="7" y="2" width="10" height="20" rx="2.2" transform="rotate(90 12 12)"/>
        <path d="M12 6.2v1.6M9.5 20.5h5" transform="rotate(90 12 12)"/>
        <path d="M4 4.5a9 9 0 0 1 15 4M20 19.5a9 9 0 0 1-15-4" stroke-width="1.8"/>
        <path d="M18.5 4.5H21v2.5M5.5 19.5H3V17" stroke-width="1.8"/>
      </svg>
      <p class="phone-rotate-lock-text" lang="hy">Խնդրում ենք հեռախոսը շրջել ուղղահայաց դիրքի։</p>
      <p class="phone-rotate-lock-text" lang="en">Please rotate your phone back to portrait.</p>
    </div>

    <!-- bootGate.js is the only script loaded unconditionally: it decides
         whether to show the calculator lock screen or boot the real app
         (dynamically importing everything below), so none of the real
         app's modules -- app.js included -- ever load, run, or touch the
         network until the correct code is entered. -->
    <script type="module" src="js/bootGate.js"></script>
  </body>
</html>
