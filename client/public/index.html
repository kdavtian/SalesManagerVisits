<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>KAD Motors</title>
    <meta name="theme-color" content="#f6f7f9" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KAD Motors" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      // Applied synchronously, before first paint, to avoid a flash of the
      // wrong theme. Light is the default; dark only applies if chosen.
      try {
        var t = localStorage.getItem("fieldvisits_theme");
        if (t === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>

    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="sync-banner" class="sync-banner" hidden></div>
    <header id="top-bar" class="top-bar" hidden></header>
    <main id="app" class="app-main"></main>
    <nav id="nav-bar" class="nav-bar" hidden></nav>
    <div id="install-root"></div>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/leaflet-rotate/leaflet-rotate.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
