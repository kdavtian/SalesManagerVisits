# nginx reverse proxy for Field Visits.
#
# Copy this to /etc/nginx/sites-available/field-visits on the droplet,
# replace YOUR_DOMAIN everywhere below, then symlink it into
# sites-enabled and reload nginx. See deploy/digitalocean.md for the
# full step-by-step (including the first-time Certbot run that fills in
# the ssl_certificate lines).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot's HTTP-01 challenge needs to reach this path over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Photo uploads are compressed client-side to ~1-2MB but allow headroom.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
