# nginx reverse proxy for Field Visits.
#
# Copy this to /etc/nginx/sites-available/field-visits on the droplet,
# replace YOUR_DOMAIN everywhere below, then symlink it into
# sites-enabled and reload nginx. See deploy/digitalocean.md for the
# full step-by-step (including the first-time Certbot run that fills in
# the ssl_certificate lines).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot's HTTP-01 challenge needs to reach this path over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 is enabled inline here (rather than via the newer standalone
    # "http2 on;" directive) for compatibility with nginx < 1.25.1 — e.g.
    # the 1.24.0 that ships via apt on Ubuntu 22.04/24.04.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Must stay >= the largest express.json({ limit }) in server/src/index.js
    # (currently 25mb, on /api/erp-sync -- the daily Castrol catalog/order
    # sync from the Telegram bot) -- otherwise nginx 413s a request Express
    # would have happily accepted. Photo uploads are compressed client-side
    # to ~1-2MB, well under this.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
